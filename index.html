<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priya Live Chat 💋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0b141a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .chat-container {
            width: 100%;
            max-width: 420px;
            background: #111b21;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 700px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .chat-header {
            background: #202c33;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #222d34;
        }
        .profile-pic {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }
        .profile-info h2 {
            font-size: 16px;
            color: #e9edef;
        }
        .profile-info p {
            font-size: 12px;
            color: #00a884;
            font-weight: 600;
        }
        .chat-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-image: radial-gradient(#222d34 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }
        .incoming {
            background: #202c33;
            color: #e9edef;
            align-self: flex-start;
            border-top-left-radius: 0;
        }
        .outgoing {
            background: #005c4b;
            color: #e9edef;
            align-self: flex-end;
            border-top-right-radius: 0;
        }
        .typing-indicator {
            font-size: 12px;
            color: #8696a0;
            font-style: italic;
            display: none;
            padding: 5px 10px;
        }
        .chat-footer {
            background: #202c33;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-box {
            display: flex;
            gap: 8px;
        }
        .chat-footer input {
            flex: 1;
            background: #2a3942;
            border: none;
            padding: 12px 15px;
            border-radius: 20px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }
        .chat-footer button {
            background: #00a884;
            color: white;
            border: none;
            padding: 0 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .action-banner {
            background: #ff416c;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            display: none; 
            box-shadow: 0 4px 10px rgba(255,65,108,0.4);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400" alt="Priya" class="profile-pic">
            <div class="profile-info">
                <h2>Priya Sharma 💋</h2>
                <p>● Online (Typing...)</p>
            </div>
        </div>

        <!-- Chat Messages Area -->
        <div class="chat-body" id="chatBody">
            <div class="message incoming">Hi there! 👋 Akele bore ho rahi hu... Reels se aayi ho kya mere paas?</div>
            <div class="message incoming">Mujhse personal chat karoge? ❤️</div>
            <div class="typing-indicator" id="typing">Priya is typing...</div>
        </div>

        <!-- Chat Footer / Input -->
        <div class="chat-footer">
            <!-- Adsterra Link Attached Here -->
            <a href="https://www.profitableratecpmnetwork.com/qw8cpu933z?key=4135e735bc404225ac8e02cfdf43056b" id="ctaBtn" class="action-banner" target="_blank">
                🔥 Click Here to Start Real WhatsApp Chat with Priya 💬
            </a>

            <div class="input-box">
                <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const chatBody = document.getElementById('chatBody');
        const userInput = document.getElementById('userInput');
        const typingIndicator = document.getElementById('typing');
        const ctaBtn = document.getElementById('ctaBtn');

        let messageCount = 0;

        setTimeout(() => {
            showTypingAndSend("Main aapka hi wait kar rahi thi... Kitne handsome ho aap! 😊");
        }, 3000);

        function sendMessage() {
            let text = userInput.value.trim();
            if(text === "") return;

            let userMsg = document.createElement('div');
            userMsg.classList.add('message', 'outgoing');
            userMsg.innerText = text;
            chatBody.appendChild(userMsg);
            userInput.value = "";
            chatBody.scrollTop = chatBody.scrollHeight;

            messageCount++;

            setTimeout(() => {
                showBotReply(messageCount);
            }, 1500);
        }

        function showTypingAndSend(replyText) {
            typingIndicator.style.display = "block";
            chatBody.scrollTop = chatBody.scrollHeight;

            setTimeout(() => {
                typingIndicator.style.display = "none";
                let botMsg = document.createElement('div');
                botMsg.classList.add('message', 'incoming');
                botMsg.innerText = replyText;
                chatBody.appendChild(botMsg);
                chatBody.scrollTop = chatBody.scrollHeight;
            }, 2000);
        }

        function showBotReply(count) {
            let replies = [
                "Hehe, sachhi? Mujhe bohot achha laga aapse baat karke. 😘",
                "Yahan public chat me maza nahi aa raha, hum WhatsApp par chalein?",
                "Wahan hum video call bhi karenge... Niche diye hue button par click karo aur mujhse jude! 👇"
            ];

            let textToDisplay = replies[count - 1] || "Jaldi se niche click karo, main wahan wait kar rahi hu! 💖";
            
            showTypingAndSend(textToDisplay);

            if (count >= 2) {
                setTimeout(() => {
                    ctaBtn.style.display = "block";
                    chatBody.scrollTop = chatBody.scrollHeight;
                }, 3000);
            }
        }

        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
          </html>
